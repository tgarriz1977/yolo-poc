services:
  yolo26-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yolo26-rtx3060:latest
    container_name: yolo26-web
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      # Guardar salidas en el host
      - ./outputs:/app/outputs
      # Montar app.py y muestras en vivo
      - ./app.py:/app/app.py
      - ./samples:/app/samples
      # Montar modelos YOLO-World predescargados
      - ./yolov8s-worldv2.pt:/app/yolov8s-worldv2.pt
      - ./yolov8m-worldv2.pt:/app/yolov8m-worldv2.pt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
