services:
  yolo26-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yolo26-rtx3060:latest
    container_name: yolo26-web
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      # Los vídeos e imágenes procesados se guardan directamente en el host
      - ./outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
